services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codeintel
      POSTGRES_PASSWORD: codeintel
      POSTGRES_DB: codeintel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeintel"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    # For NVIDIA GPUs, uncomment:
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  ollama-init:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${EMBED_MODEL:-nomic-embed-text} && ollama pull ${CHAT_MODEL:-qwen2.5-coder:7b}"]
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "apps/server/dist/api.js"]
    env_file: .env
    environment: &server-env
      DATABASE_URL: postgres://codeintel:codeintel@postgres:5432/codeintel
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      REPOS_DIR: /data/repos
    ports: ["4000:4000"]
    volumes: [repos:/data/repos]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "apps/server/dist/worker.js"]
    env_file: .env
    environment: *server-env
    volumes: [repos:/data/repos]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  ollama:
  repos:
